<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Origins of Late</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0a0a0a;
            overflow-x: hidden;
            font-family: monospace;
            min-height: 100vh;
            position: relative;
        }

        /* Matrix Rain Background */
        #rain-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 90px 20px 200px;
        }

        #canvas {
            line-height: 0.92;
            letter-spacing: 0.09em;
            font-size: 14px;
            color: #00ff88;
            user-select: none;
            white-space: pre;
            text-align: center;
            margin: auto;
        }

        .bottom-text {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 5;
        }

        .title {
            color: rgba(0, 255, 136, 0.9);
            font-size: 1.5rem;
            margin-bottom: 6px;
            letter-spacing: 0.25em;
            text-align: center;
            text-shadow: 0 0 12px rgba(0, 255, 136, 0.4);
        }

        .slogan {
            color: rgba(0, 255, 136, 0.6);
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            text-align: center;
            font-style: italic;
        }

        /* Top Tabs Container */
        .top-tabs {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 40px;
            z-index: 20;
        }

        .tab {
            position: relative;
            cursor: pointer;
        }

        .tab-button {
            background: transparent;
            color: rgba(0, 255, 136, 0.7);
            font-size: 1rem;
            border: 1px solid transparent;
            padding: 10px 28px;
            font-family: monospace;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.35s ease;
        }

        .tab-button:hover {
            color: #00ff88;
            border-color: #00ff88;
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.5);
        }

        .tab-dropdown {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 10px;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid rgba(0, 255, 136, 0.3);
            min-width: 160px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .tab:hover .tab-dropdown {
            opacity: 1;
            visibility: visible;
        }

        .tab-dropdown a {
            display: block;
            padding: 12px 20px;
            color: rgba(0, 255, 136, 0.7);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            transition: all 0.3s ease;
            text-align: center;
            border-bottom: 1px solid rgba(0, 255, 136, 0.1);
        }

        .tab-dropdown a:last-child {
            border-bottom: none;
        }

        .tab-dropdown a:hover {
            color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
            transform: translateX(8px);
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.5);
        }

        /* Left Side Buttons */
        .left-button {
            position: fixed;
            left: 45px;
            padding: 11px 26px;
            background: transparent;
            color: rgba(0, 255, 136, 0.6);
            font-size: 0.85rem;
            font-weight: normal;
            border: none;
            cursor: pointer;
            font-family: monospace;
            letter-spacing: 0.15em;
            transition: all 0.35s ease;
            text-decoration: none;
            z-index: 10;
        }

        .left-button:hover {
            color: #00ff88;
            transform: translateX(12px);
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.5);
        }

        /* Garage Button */
        .garage-button {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 36px;
            background: transparent;
            color: rgba(0, 255, 136, 0.85);
            font-size: 0.98rem;
            font-weight: normal;
            border: 1px solid transparent;
            cursor: pointer;
            font-family: monospace;
            letter-spacing: 0.22em;
            transition: all 0.4s ease;
            text-decoration: none;
            z-index: 10;
        }

        .garage-button:hover {
            color: #00ff88;
            border-color: #00ff88;
            transform: translateX(-50%) translateY(-4px);
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.5);
        }

        /* Vault Button */
        .vault-button {
            position: fixed;
            bottom: 22px;
            right: 28px;
            padding: 8px 22px;
            background: transparent;
            color: rgba(0, 255, 136, 0.25);
            font-size: 0.65rem;
            font-weight: normal;
            border: none;
            cursor: pointer;
            font-family: monospace;
            letter-spacing: 0.15em;
            transition: all 0.4s ease;
            text-decoration: none;
            z-index: 10;
        }

        .vault-button:hover {
            color: rgba(0, 255, 136, 0.45);
            transform: translateY(-2px);
        }

        /* Left button positions */
        .diamonds-button   { top: 38%; }
        .cyberboard-button { top: 50%; }

        /* Mobile */
        @media (max-width: 900px) {
            .top-tabs {
                gap: 20px;
            }
            .tab-button {
                padding: 8px 20px;
                font-size: 0.9rem;
            }
            .left-button {
                left: 25px;
                padding: 10px 22px;
                font-size: 0.8rem;
            }
            .garage-button {
                padding: 11px 32px;
                font-size: 0.93rem;
            }
            .vault-button {
                right: 18px;
                font-size: 0.62rem;
            }
        }

        @media (max-width: 600px) {
            .title {
                font-size: 1.45rem;
                margin-bottom: 45px;
            }
            .top-tabs {
                top: 20px;
                gap: 15px;
            }
            .tab-button {
                padding: 7px 16px;
                font-size: 0.8rem;
            }
            .left-button {
                left: 18px;
                font-size: 0.77rem;
                padding: 9px 20px;
            }
            .container {
                padding-top: 110px;
                padding-bottom: 160px;
            }
            #canvas {
                font-size: 12px;
            }
            .diamonds-button   { top: 38%; }
            .cyberboard-button { top: 50%; }
        }
    </style>
</head>
<body>
    <!-- Matrix Rain Canvas -->
    <canvas id="rain-canvas"></canvas>

    <!-- Top Tabs -->
    <div class="top-tabs">
        <div class="tab">
            <button class="tab-button">GAMES</button>
            <div class="tab-dropdown">
                <a href="https://originsoflate.xyz/diamondintherough/">DIAMONDS</a>
                <a href="https://originsoflate.xyz/mines/">MINES</a>
                <a href="https://originsoflate.xyz/sunsethoops/">HOOPS</a>
                <a href="https://originsoflate.xyz/chess/">CHESS</a>
            </div>
        </div>
        <div class="tab">
            <button class="tab-button">SOUNDS</button>
            <div class="tab-dropdown">
                <a href="https://originsoflate.xyz/pondering/">PONDERING</a>
                <a href="#">MUSIC</a>
            </div>
        </div>
        <div class="tab">
            <button class="tab-button">TECH</button>
            <div class="tab-dropdown">
                <a href="https://originsoflate.xyz/cyberboard/">CYBERBOARD</a>
                <a href="https://shaden.technology/garage/">THE GARAGE</a>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div id="canvas"></div>
    </div>

    <!-- Bottom Title and Slogan -->
    <div class="bottom-text">
        <div class="title">ORIGINS OF LATE</div>
        <div class="slogan">A personal digital studio</div>
    </div>

    <!-- Vault Bottom Right -->
    <a href="https://originsoflate.xyz/vault/" class="vault-button">VAULT</a>

    <script>
        // Matrix Rain
        const rainCanvas = document.getElementById('rain-canvas');
        const ctx = rainCanvas.getContext('2d');
        rainCanvas.width = window.innerWidth;
        rainCanvas.height = window.innerHeight;
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()_+-=[]{}|;:\'",.<>?/～!！@#￥%……&*（）——+【】｛｝；：＂＇，。、《》？';
        const fontSize = 14;
        let columns = rainCanvas.width / fontSize;
        let drops = Array(Math.floor(columns)).fill(1);
        
        function drawRain() {
            ctx.fillStyle = 'rgba(10, 10, 10, 0.08)';
            ctx.fillRect(0, 0, rainCanvas.width, rainCanvas.height);
            ctx.fillStyle = '#00ff88';
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > rainCanvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        
        drawRain();
        setInterval(drawRain, 45);
        
        window.addEventListener('resize', () => {
            rainCanvas.width = window.innerWidth;
            rainCanvas.height = window.innerHeight;
            columns = rainCanvas.width / fontSize;
            drops = Array(Math.floor(columns)).fill(1);
        });

        // ASCII Gorilla Face
        const canvas = document.getElementById('canvas');
        let width = 80;
        let height = 50;
        let grid = [];
        let time = 0;
        const textString = "originsoflate";
        let textPositions = [];

        function initGrid() {
            grid = [];
            for (let y = 0; y < height; y++) {
                let row = [];
                for (let x = 0; x < width; x++) {
                    row.push(' ');
                }
                grid.push(row);
            }
        }

        function render() {
            let html = '';
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    html += grid[y][x];
                }
                html += '\n';
            }
            canvas.textContent = html;
        }

        function isInFace(x, y) {
            const cx = width / 2;
            const cy = height / 2;
            const dx = x - cx;
            const dy = y - cy;
            
            const upperHeadWidth = 20;
            const upperHeadHeight = 15;
            const lowerJawWidth = 26;
            const lowerJawHeight = 18;
            
            if (dy < 0) {
                const upperDist = (dx * dx) / (upperHeadWidth * upperHeadWidth) + (dy * dy) / (upperHeadHeight * upperHeadHeight);
                if (dy < -8 && Math.abs(dx) < 20) {
                    const foreheadDist = (dx * dx) / (20 * 20) + ((dy + 8) * (dy + 8)) / (8 * 8);
                    if (foreheadDist < 1.2) {
                        const isEdge = foreheadDist > 0.85 && foreheadDist < 1.2;
                        return { inFace: true, depth: 1.5 - foreheadDist, isEdge, hairZone: 0 };
                    }
                }
                if (upperDist < 1) {
                    const isEdge = upperDist > 0.75 && upperDist < 1;
                    return { inFace: true, depth: 1 - upperDist, isEdge, hairZone: 0 };
                }
            } else {
                const cheekRounding = Math.pow(Math.abs(dx) / lowerJawWidth, 3.0);
                const jawRounding = Math.pow(Math.abs(dy) / lowerJawHeight, 2.2);
                const lowerDist = cheekRounding + jawRounding;
                if (lowerDist < 1) {
                    const isEdge = lowerDist > 0.65 && lowerDist < 1;
                    return { inFace: true, depth: 1 - lowerDist, isEdge, hairZone: 0 };
                }
            }
            
            const upperDist = (dx * dx) / (upperHeadWidth * upperHeadWidth) + (dy * dy) / (upperHeadHeight * upperHeadHeight);
            const cheekRounding = Math.pow(Math.abs(dx) / lowerJawWidth, 3.0);
            const jawRounding = Math.pow(Math.abs(dy) / lowerJawHeight, 2.2);
            const lowerDist = cheekRounding + jawRounding;
            const minDist = Math.min(upperDist, lowerDist);
            
            if (minDist >= 1 && minDist < 1.15) return { inFace: false, depth: 0, isEdge: true, hairZone: 1 };
            if (minDist >= 1.15 && minDist < 1.35) return { inFace: false, depth: 0, isEdge: false, hairZone: 2 };
            if (minDist >= 1.35 && minDist < 1.6) return { inFace: false, depth: 0, isEdge: false, hairZone: 3 };
            if (minDist >= 1.6 && minDist < 1.9) return { inFace: false, depth: 0, isEdge: false, hairZone: 4 };
            
            return { inFace: false, depth: 0, isEdge: false, hairZone: 0 };
        }

        function isInEyes(x, y) {
            const cy = height / 2 - 3;
            const leftEyeX = width / 2 - 9;
            const rightEyeX = width / 2 + 9;
            const eyeRadius = 3;
            const pupilRadius = 1.8;
            const socketRadius = 5;
            
            const leftDist = Math.sqrt((x - leftEyeX) ** 2 + (y - cy) ** 2);
            const rightDist = Math.sqrt((x - rightEyeX) ** 2 + (y - cy) ** 2);
            
            if (leftDist < socketRadius || rightDist < socketRadius) {
                if (leftDist < pupilRadius || rightDist < pupilRadius) return { inEyes: true, isPupil: true, isDeepSocket: false };
                if (leftDist < eyeRadius || rightDist < eyeRadius) return { inEyes: true, isPupil: false, isDeepSocket: false };
                return { inEyes: true, isPupil: false, isDeepSocket: true };
            }
            return { inEyes: false, isPupil: false, isDeepSocket: false };
        }

        function isInBrow(x, y) {
            const cy = height / 2 - 6;
            const browHeight = 3;
            const browWidth = 22;
            const cx = width / 2;
            const dy = Math.abs(y - cy);
            const dx = Math.abs(x - cx);
            if (dy < browHeight && dx < browWidth) {
                const intensity = 1 - (dy / browHeight) * (dx / browWidth);
                return { inBrow: true, intensity };
            }
            return { inBrow: false, intensity: 0 };
        }

        function isInNose(x, y) {
            const cx = width / 2;
            const cy = height / 2 + 4;
            const noseWidth = 8;
            const noseHeight = 6;
            
            if (Math.abs(x - cx) < 3 && y > cy - 6 && y < cy) return { inNose: true, isNostril: false, isBridge: true };
            
            if (Math.abs(x - cx) < noseWidth && Math.abs(y - cy) < noseHeight) {
                const leftNostrilX = cx - 4;
                const rightNostrilX = cx + 4;
                const nostrilY = cy + 1;
                const nostrilRadius = 2;
                
                const leftNostrilDist = Math.sqrt((x - leftNostrilX) ** 2 + (y - nostrilY) ** 2);
                const rightNostrilDist = Math.sqrt((x - rightNostrilX) ** 2 + (y - nostrilY) ** 2);
                
                if (leftNostrilDist < nostrilRadius || rightNostrilDist < nostrilRadius) {
                    return { inNose: true, isNostril: true, isBridge: false };
                }
                return { inNose: true, isNostril: false, isBridge: false };
            }
            return { inNose: false, isNostril: false, isBridge: false };
        }

        function isInMouth(x, y) {
            const cx = width / 2;
            const cy = height / 2 + 12;
            const mouthWidth = 11;
            const lipHeight = 2;
            const dx = x - cx;
            const dy = y - cy;
            if (Math.abs(dx) < mouthWidth && Math.abs(dy) < lipHeight) {
                return { inMouth: true, isLip: Math.abs(dy) < 1 };
            }
            return { inMouth: false, isLip: false };
        }

        function isInMuzzle(x, y) {
            const cx = width / 2;
            const cy = height / 2 + 9;
            const muzzleWidth = 16;
            const muzzleHeight = 10;
            const dx = (x - cx) / muzzleWidth;
            const dy = (y - cy) / muzzleHeight;
            const dist = dx * dx + dy * dy;
            if (dist < 1) return { inMuzzle: true, depth: 1 - dist };
            return { inMuzzle: false, depth: 0 };
        }

        function update() {
            initGrid();
            const t = time * 0.03;
            
            if (Math.random() < 0.008 && textPositions.length === 0) {
                const mouthY = Math.floor(height / 2 + 12);
                const centerX = Math.floor(width / 2 - textString.length / 2);
                textPositions.push({ x: centerX, y: mouthY, life: 80, opacity: 0 });
            }
            
            textPositions = textPositions.filter(pos => {
                pos.life--;
                if (pos.life > 60) pos.opacity = (80 - pos.life) / 20;
                else if (pos.life < 20) pos.opacity = pos.life / 20;
                else pos.opacity = 1;
                return pos.life > 0;
            });
            
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const wave = Math.sin(x * 0.15 + y * 0.12 + t);
                    const noise = Math.sin(x * 0.3 + t * 0.7) * Math.cos(y * 0.25 + t * 0.5);
                    const faceInfo = isInFace(x, y);
                    
                    const browInfo = isInBrow(x, y);
                    if (browInfo.inBrow) {
                        grid[y][x] = browInfo.intensity > 0.5 ? '8' : '1';
                    } else {
                        const eyeInfo = isInEyes(x, y);
                        if (eyeInfo.inEyes) {
                            grid[y][x] = eyeInfo.isPupil ? '8' : (eyeInfo.isDeepSocket ? '8' : '1');
                        } else {
                            const noseInfo = isInNose(x, y);
                            if (noseInfo.inNose) {
                                grid[y][x] = noseInfo.isNostril ? '8' : (noseInfo.isBridge ? '1' : (wave > 0 ? '1' : '8'));
                            } else {
                                const mouthInfo = isInMouth(x, y);
                                if (mouthInfo.inMouth) {
                                    grid[y][x] = mouthInfo.isLip ? '8' : '1';
                                } else {
                                    const muzzleInfo = isInMuzzle(x, y);
                                    if (muzzleInfo.inMuzzle) {
                                        const muzzlePattern = wave * 0.4 + noise * 0.6 + muzzleInfo.depth;
                                        grid[y][x] = muzzlePattern > 0.5 ? '1' : '8';
                                    } else if (faceInfo.inFace) {
                                        const combined = wave + noise + faceInfo.depth * 0.7;
                                        grid[y][x] = combined > 0.5 ? '1' : '8';
                                    } else if (faceInfo.isEdge) {
                                        const dotPattern = Math.sin(x * 0.8 + y * 0.6 + t * 0.3);
                                        if (dotPattern > 0.1) grid[y][x] = '.';
                                    } else if (faceInfo.hairZone > 0) {
                                        const hairDensity = 1 - (faceInfo.hairZone * 0.15);
                                        const hairPattern = Math.sin(x * 0.9 + y * 0.7 + t * 0.2) * Math.cos(x * 0.5 + y * 0.4);
                                        if (hairPattern > (0.2 - hairDensity)) grid[y][x] = '.';
                                    } else {
                                        const bgPattern = Math.sin(x * 0.1 + t * 0.3) * Math.cos(y * 0.08 + t * 0.2);
                                        if (bgPattern > 0.95) grid[y][x] = '.';
                                    }
                                }
                            }
                        }
                    }
                }
            }
            
            textPositions.forEach(pos => {
                if (pos.opacity > Math.random()) {
                    for (let i = 0; i < textString.length; i++) {
                        const tx = Math.floor(pos.x) + i;
                        if (tx >= 0 && tx < width && pos.y >= 0 && pos.y < height) {
                            const checkFace = isInFace(tx, pos.y);
                            if (checkFace.inFace) grid[pos.y][tx] = textString[i];
                        }
                    }
                }
            });
            
            time++;
        }

        function animate() {
            update();
            render();
            requestAnimationFrame(animate);
        }

        initGrid();
        animate();
    </script>
</body>
</html>
